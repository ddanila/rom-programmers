name: Shared workflow tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - id: minipro
        run: python -c 'import json; print("revision=" + json.load(open("dependencies.lock.json"))["minipro"]["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ddanila/minipro
          ref: ${{ steps.minipro.outputs.revision }}
          path: .tools/minipro
          persist-credentials: false
      - run: python -m unittest discover -s tests -v
        env:
          RF2_REQUIRE_MOCK: '1'
      - run: python -m pip install .
      - run: rom-programmers info --profile t48-rf2
